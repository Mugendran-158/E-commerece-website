  <defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#451a03"/><stop offset="100%" style="stop-color:#b45309"/></linearGradient></defs>
  <rect width="800" height="600" fill="url(#g)"/>
