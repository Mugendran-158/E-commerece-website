<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0ea5e9"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#g)"/>
  <!-- Watch face -->
  <circle cx="300" cy="195" r="85" fill="none" stroke="white" stroke-width="8"/>
  <circle cx="300" cy="195" r="72" fill="rgba(255,255,255,0.1)"/>
  <!-- Watch strap top -->
  <rect x="275" y="90" width="50" height="30" rx="8" fill="white" opacity="0.6"/>
  <!-- Watch strap bottom -->
  <rect x="275" y="275" width="50" height="30" rx="8" fill="white" opacity="0.6"/>
  <!-- Watch hands -->
  <line x1="300" y1="195" x2="300" y2="140" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <line x1="300" y1="195" x2="340" y2="195" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <circle cx="300" cy="195" r="6" fill="white"/>
  <!-- Hour markers -->
  <line x1="300" y1="125" x2="300" y2="137" stroke="white" stroke-width="3"/>
  <line x1="300" y1="253" x2="300" y2="265" stroke="white" stroke-width="3"/>
  <line x1="228" y1="195" x2="240" y2="195" stroke="white" stroke-width="3"/>
  <line x1="360" y1="195" x2="372" y2="195" stroke="white" stroke-width="3"/>
  <text x="300" y="360" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle" opacity="0.9">Accessories</text>
</svg>
