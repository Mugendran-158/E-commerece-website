<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.3"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <ellipse cx="600" cy="100" rx="250" ry="200" fill="url(#glow)"/>
  <!-- Shopping bags -->
  <rect x="180" y="140" width="100" height="130" rx="8" fill="white" opacity="0.9"/>
  <path d="M195 140 Q200 110 230 110 Q260 110 265 140" fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <rect x="195" y="175" width="70" height="4" rx="2" fill="#4f46e5" opacity="0.8"/>
  <rect x="195" y="192" width="55" height="4" rx="2" fill="#4f46e5" opacity="0.5"/>
  <!-- Large bag -->
  <rect x="320" y="100" width="150" height="200" rx="12" fill="white" opacity="0.95"/>
  <path d="M340 100 Q345 55 395 55 Q445 55 450 100" fill="none" stroke="white" stroke-width="8" stroke-linecap="round"/>
  <rect x="340" y="150" width="110" height="6" rx="3" fill="#4f46e5" opacity="0.9"/>
  <rect x="340" y="172" width="90" height="4" rx="2" fill="#4f46e5" opacity="0.6"/>
  <rect x="340" y="190" width="100" height="4" rx="2" fill="#4f46e5" opacity="0.5"/>
  <!-- Small bag right -->
  <rect x="510" y="165" width="90" height="115" rx="8" fill="white" opacity="0.85"/>
  <path d="M524 165 Q528 138 555 138 Q582 138 576 165" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <rect x="524" y="197" width="62" height="4" rx="2" fill="#06b6d4" opacity="0.8"/>
  <rect x="524" y="212" width="48" height="4" rx="2" fill="#06b6d4" opacity="0.5"/>
  <!-- Stars / sparkles -->
  <circle cx="150" cy="200" r="4" fill="#fbbf24"/>
  <circle cx="680" cy="150" r="6" fill="#fbbf24" opacity="0.8"/>
  <circle cx="650" cy="310" r="4" fill="#818cf8" opacity="0.8"/>
  <line x1="150" y1="184" x2="150" y2="216" stroke="#fbbf24" stroke-width="2"/>
  <line x1="134" y1="200" x2="166" y2="200" stroke="#fbbf24" stroke-width="2"/>
  <!-- Percent badge -->
  <circle cx="590" cy="260" r="45" fill="#4f46e5" opacity="0.9"/>
  <text x="590" y="252" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">UP TO</text>
  <text x="590" y="275" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#fbbf24" text-anchor="middle">40%</text>
  <text x="590" y="293" font-family="Arial,sans-serif" font-size="12" fill="white" text-anchor="middle">OFF</text>
  <!-- Bottom label -->
  <rect x="250" y="340" width="300" height="45" rx="10" fill="rgba(15,23,42,0.85)"/>
  <text x="400" y="358" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" letter-spacing="2">LIMITED DROP</text>
  <text x="400" y="377" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Up to 40% OFF Summer Trends</text>
</svg>
