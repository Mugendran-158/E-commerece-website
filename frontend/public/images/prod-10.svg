<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#1e3a5f"/><stop offset="100%" style="stop-color:#2563eb"/></linearGradient></defs>
  <rect width="800" height="600" fill="url(#g)"/>
  <!-- Watch band -->
  <rect x="358" y="90" width="84" height="420" rx="20" fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="3"/>
  <!-- Watch body -->
  <rect x="318" y="200" width="164" height="200" rx="30" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="6"/>
  <!-- Screen -->
  <rect x="330" y="212" width="140" height="176" rx="22" fill="rgba(0,0,0,0.5)"/>
  <!-- AMOLED display content -->
  <text x="400" y="260" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">98%</text>
  <text x="400" y="285" font-family="Arial,sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">SpO2</text>
  <!-- Heart rate line -->
  <polyline points="340,330 355,330 362,310 370,355 378,315 388,350 395,330 415,330 422,308 430,352 440,318 450,330 460,330" fill="none" stroke="#ef4444" stroke-width="3"/>
  <!-- Band holes -->
  <circle cx="400" cy="140" r="5" fill="white" opacity="0.4"/>
  <circle cx="400" cy="160" r="5" fill="white" opacity="0.4"/>
  <circle cx="400" cy="440" r="5" fill="white" opacity="0.4"/>
  <circle cx="400" cy="460" r="5" fill="white" opacity="0.4"/>
  <text x="400" y="540" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">Smart Fitness Tracker</text>
</svg>